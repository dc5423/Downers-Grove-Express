<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGS Express Knowledgebase</title>
<meta name="description" content="Basketball actions, concepts, screens, cuts, offenses and ball screen coverages for DGS Express.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#00204E; --deep:#0B2F60; --steel:#2E5E96; --bright:#6699CC;
  --ice:#BAD1E8; --mist:#EDF3FA; --paper:#F7F9FC; --white:#FFFFFF;
  --ink:#16243C; --body:#44536B; --muted:#7A8AA3; --line:#D9E3EF;
  --amber:#9C5A12; --amber-tint:#FBF0E2; --green:#1F6B3A; --green-tint:#E8F3EC;
  --nav:300px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:94px}
body{margin:0;background:var(--paper);color:var(--body);
  font-family:'Barlow',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:'Barlow Condensed',system-ui,Arial,sans-serif;color:var(--navy);margin:0;line-height:1.1}
a{color:var(--steel)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--bright);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:flex;align-items:flex-start}
.sidebar{width:var(--nav);flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:var(--navy);color:var(--ice)}
.brand{display:flex;align-items:center;gap:13px;padding:20px 20px 16px;text-decoration:none;
  border-bottom:1px solid rgba(186,209,232,.22)}
.brand img{width:54px;height:auto;flex:none}
.brand .mark,.brand .name{display:block}
.brand .mark{font-family:'Barlow Condensed';font-size:13px;letter-spacing:3.5px;text-transform:uppercase;color:var(--bright);font-weight:700}
.brand .name{font-family:'Barlow Condensed';font-size:30px;font-weight:700;text-transform:uppercase;color:#fff;line-height:1}
.search{padding:14px 18px;border-bottom:1px solid rgba(186,209,232,.22)}
.search input{width:100%;font:inherit;font-size:15px;color:#fff;background:#0B2F60;
  border:1px solid #2E5E96;border-radius:8px;padding:10px 12px}
.search input::placeholder{color:#8FB4D9}
.count{font-size:13px;color:#8FB4D9;padding:8px 2px 0}
nav{overflow-y:auto;flex:1;padding:10px 0 48px}
.navpart h3{font-size:15px;letter-spacing:2.4px;text-transform:uppercase;color:var(--bright);
  padding:16px 22px 7px;font-weight:700}
nav ul{list-style:none;margin:0;padding:0}
nav li a{display:block;padding:6px 22px;color:var(--ice);text-decoration:none;font-size:15.5px;border-left:3px solid transparent}
nav li a:hover{background:#0B2F60;color:#fff}
nav li a.on{border-left-color:var(--bright);background:#0B2F60;color:#fff;font-weight:600}
.topbar{display:none}

main{flex:1;min-width:0;padding:0 48px 120px;max-width:1020px}
.intro{padding:48px 0 8px}
.intro h1{font-size:60px;text-transform:uppercase}
.intro p{max-width:62ch;font-size:19px}
.credit{color:var(--muted);font-size:15.5px}

.parthead{font-size:17px;letter-spacing:3px;text-transform:uppercase;color:var(--bright);
  padding:52px 0 0;border-top:3px solid var(--navy);margin-top:40px}
.part:first-of-type .parthead{margin-top:16px}

/* ---------- topic ---------- */
.topic{background:var(--white);border:1px solid var(--line);border-radius:14px;
  padding:30px 34px;margin:26px 0}
.topic h2{font-size:38px;text-transform:uppercase}
.topic h2 .anchor{text-decoration:none;color:var(--line);font-size:26px;margin-left:10px;opacity:0}
.topic:hover h2 .anchor{opacity:1}
.src{color:var(--muted);font-size:14px;margin:2px 0 18px;letter-spacing:.4px}
.topic h3{font-size:25px;text-transform:uppercase;margin:26px 0 10px;
  padding-bottom:6px;border-bottom:2px solid var(--mist)}
.topic h4{font-size:20px;margin:18px 0 6px;color:var(--deep)}
.topic p{margin:0 0 12px}
.topic ul{margin:0 0 14px;padding-left:22px}
.topic li{margin:0 0 7px}
.lbl{padding-left:0}
.lbl span{font-family:'Barlow Condensed';font-size:16px;letter-spacing:1.6px;text-transform:uppercase;
  color:#fff;background:var(--steel);border-radius:5px;padding:3px 9px;margin-right:9px;font-weight:700;
  display:inline-block;vertical-align:1px}
li.yes{list-style:none;position:relative}
li.yes::before{content:"✓";position:absolute;left:-22px;color:var(--green);font-weight:700}
li.no{list-style:none;position:relative}
li.no::before{content:"✕";position:absolute;left:-22px;color:var(--amber);font-weight:700}
li.idea,li.warn,li.note{list-style:none;position:relative}
li.idea::before{content:"◆";position:absolute;left:-22px;color:var(--steel)}
li.warn::before{content:"▲";position:absolute;left:-22px;color:var(--amber)}
li.note::before{content:"→";position:absolute;left:-22px;color:var(--steel)}

/* ---------- SWOT ---------- */
.swot-head{margin-top:28px}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0 18px}
.quad{border-radius:12px;padding:20px 22px}
.quad h4{margin:0 0 10px;font-size:21px;letter-spacing:1px;text-transform:uppercase}
.quad ul{padding-left:20px;margin-bottom:0}
.quad li{font-size:16px}
.quad.strengths{background:var(--mist);border-top:6px solid var(--navy)}
.quad.opportunities{background:var(--mist);border-top:6px solid var(--steel)}
.quad.weaknesses{background:var(--amber-tint);border-top:6px solid var(--amber)}
.quad.threats{background:var(--amber-tint);border-top:6px solid var(--amber)}
.quad.strengths h4{color:var(--navy)}
.quad.opportunities h4{color:var(--steel)}
.quad.weaknesses h4,.quad.threats h4{color:var(--amber)}
.quad.weaknesses,.quad.threats{color:#4A3A22}

/* ---------- glossary ---------- */
.glossary{margin:0;display:grid;gap:0}
.gterm{display:grid;grid-template-columns:240px 1fr;gap:0 24px;padding:11px 0;border-top:1px solid var(--mist)}
.gterm:first-child{border-top:none}
.glossary dt{font-weight:600;color:var(--navy);font-size:17px}
.glossary dd{margin:0}
.glossary dd.plain{grid-column:1/-1;color:var(--body)}


/* ---------- about ---------- */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0 6px}
.agrid.two{grid-template-columns:1fr 1fr}
.acard{background:var(--mist);border-radius:12px;padding:20px 22px;border-top:5px solid var(--navy)}
.acard.wide{grid-column:1/-1;border-top-color:var(--steel)}
.acard h4{font-size:21px;text-transform:uppercase;letter-spacing:.6px;margin:0 0 4px}
.acard h5{font-family:'Barlow Condensed';font-size:17px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--steel);margin:0 0 5px}
.cardsub{font-size:15px;color:var(--muted);margin:0 0 10px}
.acard ul{margin:0;padding-left:19px}
.acard li{font-size:16px;margin:0 0 4px}
.acard ul.flat{margin-bottom:12px}
.subcols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-top:4px;
  border-top:1px solid var(--line);margin-top:4px}
.andmore{font-family:'Barlow Condensed';font-size:18px;letter-spacing:3px;text-transform:uppercase;
  color:var(--bright);font-weight:700;margin:10px 0 2px}
.anote{font-size:15.5px;background:var(--white);border:1px solid var(--line);border-left:5px solid var(--bright);
  border-radius:0 10px 10px 0;padding:13px 18px;margin:12px 0 0}
.anote span{font-family:'Barlow Condensed';font-size:14px;letter-spacing:1.6px;text-transform:uppercase;
  color:#fff;background:var(--steel);border-radius:4px;padding:2px 8px;margin-right:9px;font-weight:700}
.about .topic h3,.about h3{margin-top:24px}
@media (max-width:980px){
  .agrid,.agrid.two{grid-template-columns:1fr}
  .subcols{grid-template-columns:1fr;gap:12px}
}


/* ---------- search in the main column ---------- */
.searchbar{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;
  background:var(--paper);padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.searchbar input{flex:1;font:inherit;font-size:17px;color:var(--ink);background:var(--white);
  border:2px solid var(--line);border-radius:10px;padding:12px 15px;min-width:0}
.searchbar input:focus{border-color:var(--bright);outline:none}
.searchbar button{font:inherit;font-size:15px;background:var(--navy);color:#fff;border:none;
  border-radius:10px;padding:12px 18px;cursor:pointer;flex:none}
.drawerclose{display:none}
.backdrop{position:fixed;inset:0;background:rgba(0,12,30,.55);z-index:35;border:none}
.results{background:var(--white);border:1px solid var(--line);border-left:6px solid var(--bright);
  border-radius:0 12px 12px 0;padding:18px 22px;margin:18px 0 8px}
.rcount{font-family:'Barlow Condensed';font-size:24px;font-weight:700;color:var(--navy);
  text-transform:uppercase;letter-spacing:.6px;margin:0 0 10px}
.rchips{display:flex;flex-wrap:wrap;gap:8px}
.rchips a{font-size:15.5px;text-decoration:none;color:var(--navy);background:var(--mist);
  border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.rchips a:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
mark.hit{background:#FFE9A8;color:inherit;border-radius:3px;padding:0 2px}


/* ---------- drills ---------- */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.dcard{background:var(--mist);border-radius:12px;padding:16px 18px;border-left:5px solid var(--steel);
  display:flex;flex-direction:column;gap:6px}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dcard h4{font-size:20px;margin:0;line-height:1.15;flex:1;min-width:0}
.dsrc{font-family:'Barlow Condensed';font-size:13px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--steel);border:1px solid var(--line);background:var(--white);border-radius:5px;
  padding:2px 8px;font-weight:700;flex:none}
.dnote{font-size:15.5px;color:var(--body);margin:0}
.dsee{font-size:14.5px;color:var(--muted);margin:0}
.dlinks{display:flex;gap:9px;align-items:center;margin:4px 0 0;flex-wrap:wrap}
.dplay{font:inherit;font-size:15px;font-weight:600;background:var(--navy);color:#fff;border:none;
  border-radius:8px;padding:8px 15px;cursor:pointer}
.dplay:hover{background:var(--steel)}
.dout{font-size:15px;font-weight:600;color:var(--steel);text-decoration:none;
  border:1px solid var(--line);background:var(--white);border-radius:8px;padding:8px 15px}
.dout:hover{border-color:var(--steel)}
.dcard iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:9px;display:block;margin-top:4px}
@media (max-width:980px){ .dgrid{grid-template-columns:1fr} }

/* ---------- figures ---------- */
.figs{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0 4px}
figure{margin:0;flex:1 1 320px;max-width:100%}
figure img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;background:var(--mist)}
figcaption{font-size:13px;color:var(--muted);padding-top:5px}


figure.video{flex:1 1 420px;max-width:560px}
.playbox{display:block;width:100%;position:relative;padding:0;border:1px solid var(--line);
  border-radius:10px;overflow:hidden;background:#0B2F60;cursor:pointer;aspect-ratio:16/9}
.playbox img{width:100%;height:100%;object-fit:cover;display:block;border:none;border-radius:0;
  transition:opacity .15s ease}
.playbox:hover img{opacity:.78}
.playbox .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:66px;height:66px;border-radius:50%;background:rgba(0,32,78,.86);color:#fff;
  font-size:24px;line-height:66px;text-align:center;padding-left:4px}
.playbox:hover .play{background:var(--navy)}
figure.video iframe{width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;display:block}

.empty{display:none;padding:60px 0;color:var(--muted);font-size:19px}
.totop{position:fixed;right:22px;bottom:22px;background:var(--navy);color:#fff;border:none;border-radius:50%;
  width:46px;height:46px;font-size:20px;cursor:pointer;display:none}

@media (max-width:980px){
  :root{--nav:0px}
  .shell{display:block}
  .sidebar{position:fixed;left:0;top:0;width:86%;max-width:330px;transform:translateX(-102%);
    transition:transform .2s ease;z-index:40;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.open .sidebar{transform:none}
  .topbar{display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30;
    background:var(--navy);color:#fff;padding:12px 16px}
  .searchbar{top:60px;padding:12px 0 10px}
  html{scroll-padding-top:150px}
  .drawerclose{display:block;position:absolute;right:12px;top:12px;width:40px;height:40px;
    background:#0B2F60;color:#fff;border:1px solid #2E5E96;border-radius:10px;font-size:17px;
    line-height:1;cursor:pointer;z-index:2}
  .sidebar .brand{padding-right:62px}
  .topbar button{background:#0B2F60;color:#fff;border:1px solid #2E5E96;border-radius:8px;
    font:inherit;font-size:15px;padding:8px 14px;cursor:pointer}
  .topbar .t{font-family:'Barlow Condensed';font-size:22px;font-weight:700;text-transform:uppercase}
  main{padding:0 16px 90px;max-width:100%}
  .intro{padding:28px 0 4px}
  .intro h1{font-size:40px}
  .topic{padding:22px 18px;border-radius:12px}
  .topic h2{font-size:30px}
  .swot{grid-template-columns:1fr}
  .gterm{grid-template-columns:1fr;gap:2px}
  .glossary dt{font-size:18px}
}
@media print{
  .sidebar,.topbar,.totop{display:none}
  body{background:#fff;font-size:11pt}
  .topic{break-inside:avoid;border:none;padding:0;margin:18px 0}
  main{padding:0;max-width:100%}
}
</style>
</head>
<body>
<div class="topbar">
  <button id="menu" aria-expanded="false">Menu</button>
  <span class="t">DGS Express Knowledgebase</span>
</div>
<div class="backdrop" id="backdrop" hidden></div>
<div class="shell">
  <aside class="sidebar">
    <button class="drawerclose" id="drawerclose" aria-label="Close the menu">✕</button>
    <a class="brand" href="#top">
      <img src="img/logo.png" alt="DGS Express logo" width="54" height="48">
      <span>
        <span class="mark">DGS Express</span>
        <span class="name">Knowledgebase</span>
      </span>
    </a>
    <nav id="nav"><!--NAV--></nav>
  </aside>
  <main id="main"><span id="top"></span>
    <div class="intro">
      <h1>DGS Express Knowledgebase</h1>
      <p>A reference for actions, concepts, screens, cuts, offenses and ball screen coverages. Search below, or pick an entry from the menu.</p>
      </div>
    <div class="searchbar">
      <input id="q" type="search" placeholder="Search actions, screens, coverages…" autocomplete="off" aria-label="Search the knowledgebase">
      <button id="clear" type="button" hidden>Clear</button>
    </div>
    <div class="results" id="results" hidden>
      <p class="rcount" id="rcount"></p>
      <div class="rchips" id="rchips"></div>
    </div>
    <!--BODY-->
    <p class="empty" id="noresults">No entries match that search.</p>
  </main>
</div>
<button class="totop" id="totop" aria-label="Back to top">↑</button>
<script>
(function(){
  var topics = Array.prototype.slice.call(document.querySelectorAll('.topic'));
  var navLinks = Array.prototype.slice.call(document.querySelectorAll('nav a'));
  var parts = Array.prototype.slice.call(document.querySelectorAll('.part'));
  var navParts = Array.prototype.slice.call(document.querySelectorAll('.navpart'));
  var q = document.getElementById('q');
  var clearBtn = document.getElementById('clear');
  var empty = document.getElementById('noresults');
  var results = document.getElementById('results');
  var rcount = document.getElementById('rcount');
  var rchips = document.getElementById('rchips');
  var intro = document.querySelector('.intro');

  topics.forEach(function(t){
    t._text = (t.dataset.title + ' ' + t.textContent).toLowerCase();
    t._skip = t.dataset.nosearch === '1';
    t._rows = Array.prototype.slice.call(t.querySelectorAll('.gterm, .dcard'));
    t._rows.forEach(function(r){ r._text = r.textContent.toLowerCase(); });
  });

  function clearMarks(){
    document.querySelectorAll('mark.hit').forEach(function(m){
      var parent = m.parentNode;
      parent.replaceChild(document.createTextNode(m.textContent), m);
      parent.normalize();
    });
  }

  function markIn(root, term){
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        if(!n.nodeValue || n.nodeValue.toLowerCase().indexOf(term) < 0) return NodeFilter.FILTER_REJECT;
        var p = n.parentNode;
        if(!p || p.nodeName === 'MARK' || p.nodeName === 'SCRIPT' || p.nodeName === 'STYLE') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [], n;
    while((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(function(node){
      var text = node.nodeValue, low = text.toLowerCase(), out = document.createDocumentFragment();
      var i = 0, j;
      while((j = low.indexOf(term, i)) > -1){
        if(j > i) out.appendChild(document.createTextNode(text.slice(i, j)));
        var mk = document.createElement('mark');
        mk.className = 'hit';
        mk.textContent = text.slice(j, j + term.length);
        out.appendChild(mk);
        i = j + term.length;
      }
      if(i < text.length) out.appendChild(document.createTextNode(text.slice(i)));
      node.parentNode.replaceChild(out, node);
    });
  }

  var lastTerm = '';

  function filter(){
    var term = q.value.trim().toLowerCase();
    clearBtn.hidden = !term;
    clearMarks();

    if(!term){
      topics.forEach(function(t){
        t.style.display='';
        t._rows.forEach(function(r){ r.style.display=''; });
      });
      parts.forEach(function(p){ p.style.display=''; });
      navLinks.forEach(function(a){ a.parentNode.style.display=''; });
      navParts.forEach(function(p){ p.style.display=''; });
      empty.style.display='none';
      results.hidden = true; rchips.innerHTML = '';
      lastTerm = '';
      return;
    }

    var hits = 0, matched = [];
    topics.forEach(function(t){
      var on = !t._skip && t._text.indexOf(term) > -1;
      if(on && t._rows.length){
        var kept = 0;
        t._rows.forEach(function(r){
          var rowOn = r._text.indexOf(term) > -1;
          r.style.display = rowOn ? '' : 'none';
          if(rowOn) kept++;
        });
        if(!kept && t.dataset.title.toLowerCase().indexOf(term) < 0) on = false;
        if(!kept) t._rows.forEach(function(r){ r.style.display=''; });
      }
      t.style.display = on ? '' : 'none';
      if(on){ hits++; matched.push(t); }
      var link = document.querySelector('nav a[data-slug="'+t.id+'"]');
      if(link) link.parentNode.style.display = on ? '' : 'none';
    });
    parts.forEach(function(p){
      p.style.display = p.querySelector('.topic:not([style*="none"])') ? '' : 'none';
    });
    navParts.forEach(function(p){
      p.style.display = p.querySelector('li:not([style*="none"])') ? '' : 'none';
    });

    empty.style.display = hits ? 'none' : 'block';

    if(term.length > 1) matched.forEach(function(t){ markIn(t, term); });

    results.hidden = false;
    rcount.textContent = hits === 0
      ? 'No entries match “' + q.value.trim() + '”'
      : hits + (hits === 1 ? ' entry matches “' : ' entries match “') + q.value.trim() + '”';
    matched.sort(function(a, b){
      var at = a.dataset.title.toLowerCase().indexOf(term) > -1 ? 0 : 1;
      var bt = b.dataset.title.toLowerCase().indexOf(term) > -1 ? 0 : 1;
      if(at !== bt) return at - bt;
      return a.dataset.title.localeCompare(b.dataset.title);
    });
    rchips.innerHTML = '';
    matched.slice(0, 40).forEach(function(t){
      var a = document.createElement('a');
      a.href = '#' + t.id;
      a.textContent = t.dataset.title;
      rchips.appendChild(a);
    });
    if(matched.length > 40){
      var more = document.createElement('a');
      more.href = '#' + matched[40].id;
      more.textContent = '+ ' + (matched.length - 40) + ' more';
      rchips.appendChild(more);
    }

    if(!lastTerm && intro.getBoundingClientRect().top < -40){
      window.scrollTo({top: 0, behavior: 'smooth'});
    }
    lastTerm = term;
  }

  clearBtn.addEventListener('click', function(){ q.value=''; filter(); q.focus(); });

  q.addEventListener('input', filter);
  q.addEventListener('keydown', function(e){ if(e.key==='Escape'){ q.value=''; filter(); }});

  var spy = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      navLinks.forEach(function(a){ a.classList.toggle('on', a.dataset.slug === e.target.id); });
    });
  }, {rootMargin:'-10% 0px -80% 0px'});
  topics.forEach(function(t){ spy.observe(t); });

  var menu = document.getElementById('menu');
  var backdrop = document.getElementById('backdrop');
  var drawerClose = document.getElementById('drawerclose');

  function setDrawer(open){
    document.body.classList.toggle('open', open);
    menu.setAttribute('aria-expanded', open ? 'true' : 'false');
    backdrop.hidden = !open;
  }
  setDrawer(false);
  menu.addEventListener('click', function(){
    setDrawer(!document.body.classList.contains('open'));
  });
  backdrop.addEventListener('click', function(){ setDrawer(false); });
  drawerClose.addEventListener('click', function(){ setDrawer(false); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && document.body.classList.contains('open')) setDrawer(false);
  });
  document.querySelector('nav').addEventListener('click', function(e){
    if(e.target.tagName === 'A') setDrawer(false);
  });
  document.querySelector('.brand').addEventListener('click', function(){ setDrawer(false); });


  document.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.dplay') : null;
    if(btn){
      var card = btn.closest('.dcard');
      var fr = document.createElement('iframe');
      var u = btn.dataset.embed;
      fr.src = u + (u.indexOf('?') > -1 ? '&' : '?') + 'autoplay=1';
      fr.title = btn.getAttribute('aria-label') || 'Video';
      fr.allow = 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture';
      fr.setAttribute('allowfullscreen','');
      card.appendChild(fr);
      btn.remove();
      return;
    }
    var box = e.target.closest ? e.target.closest('.playbox') : null;
    if(!box) return;
    var src = box.dataset.embed;
    var f = document.createElement('iframe');
    f.src = src + (src.indexOf('?') > -1 ? '&' : '?') + 'autoplay=1';
    f.title = box.getAttribute('aria-label') || 'Video';
    f.allow = 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture';
    f.setAttribute('allowfullscreen','');
    f.loading = 'lazy';
    box.parentNode.replaceChild(f, box);
  });

  var totop = document.getElementById('totop');
  window.addEventListener('scroll', function(){
    totop.style.display = window.scrollY > 900 ? 'block' : 'none';
  });
  totop.addEventListener('click', function(){ window.scrollTo({top:0,behavior:'smooth'}); });
})();
</script>
</body>
</html>
